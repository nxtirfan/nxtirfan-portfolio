<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator — nxtirfan-portfolio</title>
  <link rel="icon" type="image/x-icon" href="assets/img/yuki.png">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="assets/js/tailwind.js"></script>
  <link rel="stylesheet" href="assets/css/mujica.css">
</head>
<body>
  <nav class="bg-transparent fixed top-0 w-full z-50">
    <div class="container mx-auto px-4 py-3 flex justify-between items-center">
      <a href="index.html" class="flex items-center hover-scale">
        <img src="assets/img/avemujica.png" alt="logo" class="h-10"><span class="ml-2 font-bold text-xl">nxtirfan</span>
      </a>
      <a href="index.html" class="mujica-badge hover-scale">← Beranda</a>
    </div>
  </nav>
  <section class="section-grid-fade" style="padding-top:6rem">
    <div class="grid-overlay"></div>
    <div class="container mx-auto px-4 py-12 section-content">
      <div class="max-w-md mx-auto mujica-glass p-6">
        <h1 class="text-3xl font-bold text-center">Kalkulator 🧮</h1>
        <p class="text-center text-sm mt-2 opacity-70">Versi statis (JavaScript). Konversi 1-ke-1 dari <code>kalkulator.php</code>.</p>
        <form id="form-kalkulator" class="mt-6" style="display:grid;gap:1rem">
          <div><label for="a">Angka pertama</label><input id="a" class="mujica-input" type="number" step="any" placeholder="cth. 12" required></div>
          <div><label for="b">Angka kedua</label><input id="b" class="mujica-input" type="number" step="any" placeholder="cth. 4" required></div>
          <div>
            <label for="operasi">Operasi</label>
            <select id="operasi" class="mujica-input">
              <option value="tambah">+ tambah</option>
              <option value="kurang">− kurang</option>
              <option value="kali">× kali</option>
              <option value="bagi">/ bagi</option>
            </select>
          </div>
          <button class="mujica-btn" type="submit">Hitung</button>
          <div id="hasil" class="result-ok" style="display:none"></div>
          <p id="error" class="result-err" style="display:none"></p>
        </form>
      </div>
    </div>
  </section>
<script>
document.getElementById('form-kalkulator').addEventListener('submit', function (e) {
  e.preventDefault();
  var a = parseFloat(document.getElementById('a').value);
  var b = parseFloat(document.getElementById('b').value);
  var op = document.getElementById('operasi').value;
  var h = document.getElementById('hasil'), er = document.getElementById('error');
  h.style.display = 'none'; er.style.display = 'none';
  if (isNaN(a) || isNaN(b)) { er.textContent = 'Masukkan kedua angka dengan benar.'; er.style.display = 'block'; return; }
  var hasil;
  if (op === 'tambah') hasil = a + b;
  else if (op === 'kurang') hasil = a - b;
  else if (op === 'kali') hasil = a * b;
  else { if (b === 0) { er.textContent = 'Tidak bisa dibagi dengan nol.'; er.style.display = 'block'; return; } hasil = a / b; }
  h.textContent = 'Hasilnya adalah ' + hasil; h.style.display = 'block';
});
</script>
  <script src="assets/js/main.js"></script>
</body>
</html>
