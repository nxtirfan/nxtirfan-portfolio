<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Umur &amp; Tinggi — nxtirfan-portfolio</title>
  <link rel="icon" type="image/x-icon" href="assets/img/yuki.png">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="assets/js/tailwind.js"></script>
  <link rel="stylesheet" href="assets/css/mujica.css">
</head>
<body>
  <nav class="bg-transparent fixed top-0 w-full z-50">
    <div class="container mx-auto px-4 py-3 flex justify-between items-center">
      <a href="index.html" class="flex items-center hover-scale">
        <img src="assets/img/avemujica.png" alt="logo" class="h-10"><span class="ml-2 font-bold text-xl">nxtirfan</span>
      </a>
      <a href="index.html" class="mujica-badge hover-scale">← Beranda</a>
    </div>
  </nav>
  <section class="section-grid-fade" style="padding-top:6rem">
    <div class="grid-overlay"></div>
    <div class="container mx-auto px-4 py-12 section-content">
      <div class="max-w-md mx-auto mujica-glass p-6">
        <h1 class="text-3xl font-bold text-center">Umur &amp; Tinggi 📏</h1>
        <p class="text-center text-sm mt-2 opacity-70">Versi statis (JavaScript). Konversi dari <code>umur_tinggi.php</code>.</p>
        <form id="form-umur" class="mt-6" style="display:grid;gap:1rem">
          <div><label for="umur">Umur</label><input id="umur" class="mujica-input" type="number" min="1" max="120" placeholder="cth. 17" required></div>
          <div><label for="tinggi">Tinggi badan (cm)</label><input id="tinggi" class="mujica-input" type="number" min="30" max="250" placeholder="cth. 168" required></div>
          <button class="mujica-btn" type="submit">Submit</button>
          <div id="hasil" class="result-ok" style="display:none"></div>
        </form>
      </div>
    </div>
  </section>
<script>
document.getElementById('form-umur').addEventListener('submit', function (e) {
  e.preventDefault();
  var umur = parseInt(document.getElementById('umur').value, 10);
  var tinggi = parseFloat(document.getElementById('tinggi').value);
  var out = '';
  if (umur >= 12 && umur <= 17) out += 'Umur kamu ' + umur + ' tahun, kamu harus mulai belajar lebih giat<br><br>';
  else if (umur >= 18 && umur <= 25) out += 'Umur kamu ' + umur + ' tahun, kamu sebaiknya kuliah atau melamar pekerjaan<br><br>';
  else if (umur <= 11) out += 'Umur kamu ' + umur + ' tahun, kamu masih anak anak<br><br>';
  else out += 'Umur kamu ' + umur + ' tahun, kamu sekarang sulit melamar pekerjaan<br><br>';
  if (tinggi > 170) out += 'Tinggi badan kamu ' + tinggi + ' cm, kamu cukup tinggi';
  else if (tinggi >= 150) out += 'Tinggi badan kamu ' + tinggi + ' cm, tinggi badan kamu ideal';
  else out += 'Tinggi badan kamu ' + tinggi + ' cm, kamu terlalu pendek';
  var el = document.getElementById('hasil'); el.innerHTML = out; el.style.display = 'block';
});
</script>
  <script src="assets/js/main.js"></script>
</body>
</html>
